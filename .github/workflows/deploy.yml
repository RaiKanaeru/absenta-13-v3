# ========================================
# ABSENTA 13 - Docker Build Workflow
# ========================================
# Build Docker image and push to Docker Hub
# Manual deploy required (Zero Trust Network)
# ========================================

name: 🐳 Docker Build & Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/absenta13
  NODE_VERSION: '20'

jobs:
  # ==========================================
  # BUILD & PUSH - Docker Image
  # ==========================================
  build-push:
    name: 🏗️ Build & Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: 🔨 Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build Complete
        run: |
          echo "=========================================="
          echo "   ✅ BUILD SUCCESSFUL!"
          echo "=========================================="
          echo "📦 Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "📝 Commit: ${{ github.sha }}"
          echo ""
          echo "📋 MANUAL DEPLOY REQUIRED:"
          echo "   cd /www/wwwroot/absenta13.my.id"
          echo "   docker-compose pull"
          echo "   docker-compose down && docker-compose up -d"
          echo "=========================================="
